services:
  fleetcard-app:
    build: .
    container_name: fleetcard_main_app
    ports:
      - "8080:8080"
    environment:
      # ✅ ระบุ Host ของ DB ภายนอกที่คุณมีอยู่แล้ว
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - PHP_API_URL=${PHP_API_URL}
    restart: always
